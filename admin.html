<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Portfolio Matching Colors */
        :root {
            --primary-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Login Styling (Matching Portfolio Cards) */
        #login-area { 
            display: flex; justify-content: center; align-items: center; height: 80vh; 
        }
        .login-box {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Input Styling */
        input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            width: 250px;
            margin-bottom: 20px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        /* Button Styling (Matching Front-end) */
        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s all ease;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-logout { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Dashboard Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        /* Glassmorphism Table */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: rgba(255,255,255,0.05); 
            padding: 18px; 
            text-align: left; 
            color: var(--accent);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        td { padding: 18px; border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); }
        tr:hover { background: rgba(255,255,255,0.02); }

        .btn-delete { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--danger); 
            padding: 8px 12px; 
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        #admin-content { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-area">
            <div class="login-box">
                <i class="fas fa-shield-alt fa-3x" style="color: var(--accent); margin-bottom: 20px;"></i>
                <h1 style="margin:0 0 10px 0">Admin Portal</h1>
                <p style="color: var(--text-dim); margin-bottom: 25px;">Secure Access Required</p>
                <input type="password" id="adminPass" placeholder="••••••••">
                <br>
                <button class="btn-primary" onclick="login()" style="width: 100%; justify-content: center;">
                    Unlock Dashboard
                </button>
            </div>
        </div>

        <div id="admin-content">
            <div class="header">
                <div>
                    <h2 style="margin:0">Portfolio <span style="color: var(--accent)">Insights</span></h2>
                    <p style="color: var(--text-dim); margin: 5px 0 0 0;">Manage your incoming inquiries</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-success" onclick="exportToExcel()">
                        <i class="fas fa-download"></i> Export CSV
                    </button>
                    <button class="btn-primary" onclick="refreshData()">
                        <i class="fas fa-redo"></i>
                    </button>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Time Received</th>
                            <th>Sender Name</th>
                            <th>Email Address</th>
                            <th>Message Preview</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="messages-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentPass = sessionStorage.getItem('adminToken') || "";
        let allMessages = [];

        if (currentPass) autoLogin();

        async function login() {
            const passInput = document.getElementById('adminPass').value;
            await fetchData(passInput);
        }

        async function autoLogin() {
            await fetchData(currentPass);
        }

        async function fetchData(pass) {
            const res = await fetch('/api/admin/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: pass })
            });

            if (res.ok) {
                currentPass = pass;
                sessionStorage.setItem('adminToken', pass);
                allMessages = await res.json();
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderTable();
            } else {
                if(sessionStorage.getItem('adminToken')) logout();
                else alert("Access Denied: Invalid Credentials");
            }
        }

        function renderTable() {
            const list = document.getElementById('messages-list');
            list.innerHTML = allMessages.slice().reverse().map(m => `
                <tr>
                    <td>${m.date}</td>
                    <td style="color: white; font-weight: 500;">${m.name}</td>
                    <td>${m.email}</td>
                    <td style="max-width: 400px; line-height: 1.6;">${m.message}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteMsg('${m.id}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteMsg(id) {
            if(!confirm("Are you sure you want to remove this message?")) return;
            const res = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: currentPass, id: Number(id) })
            });
            if (res.ok) autoLogin();
        }

        function refreshData() { autoLogin(); }

        function exportToExcel() {
            if(allMessages.length === 0) return alert("No messages to export.");
            let csv = "Date,Name,Email,Message\n";
            allMessages.forEach(m => {
                csv += `"${m.date}","${m.name}","${m.email}","${m.message.replace(/"/g, '""')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Portfolio_Inquiries.csv';
            a.click();
        }

        function logout() {
            sessionStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>
